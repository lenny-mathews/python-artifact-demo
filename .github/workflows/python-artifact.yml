name: Python Artifacts Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  Create-Artifacts:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

     

      - name : check python version
        run : python --version

      - name : Run Python program
        run  : python app.py
      - name : Show generated file
        run : cat result.txt

      - name : Upload the result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-result-file
          path: result.txt
          
        
      

        
      

        
       
      


  
